server {
    listen 80;
    server_name timeway.chhwork.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/timeway/public;
        try_files $uri =404;
    }
    location / { return 301 https://timeway.chhwork.cn$request_uri; }
}

server {
    listen 443 ssl;
    server_name timeway.chhwork.cn;
    ssl_certificate /etc/letsencrypt/live/timeway.chhwork.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timeway.chhwork.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/timeway.access.log;
    error_log /www/wwwlogs/timeway.error.log;

    location / {
        proxy_pass http://127.0.0.1:4312;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
